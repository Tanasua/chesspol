name: cartoon-prototype

# Ręczne uruchomienie: renderuje prototyp kreskówki (cartoon/skoczek.py) z głosem Inworld
# i wysyła wynik do Telegrama (jeśli ustawione sekrety) + artefakt.
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core libcairo2
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Render
        env:
          INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
          INWORLD_VOICE_ID: ${{ secrets.INWORLD_VOICE_ID }}
          INWORLD_MODEL: inworld-tts-2
          INWORLD_LANGUAGE: pl-PL
        run: python cartoon/skoczek.py --out out/skoczek.mp4
      - name: Telegram
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          curl -sS -F chat_id="$TELEGRAM_CHAT_ID" -F caption="Prototyp kreskówki: Skoczek" \
            -F document=@out/skoczek.mp4 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: cartoon-${{ github.run_id }}
          path: out/skoczek.mp4
          retention-days: 14
