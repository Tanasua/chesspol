name: upload-backlog

# Jednorazowo / ręcznie: paczki z GitHub Releases zrobione w trybie manual (niewgrane) -> YouTube z publishAt
# (src/upload_backlog.py). Terminy jak w harmonogramie: wt/czw/sob/nd, losowy wieczór, od najbliższego wolnego dnia.
on:
  workflow_dispatch:
    inputs:
      channels:
        description: "Kanały (spacja): pl de en hi uk ru tr"
        default: "pl de en hi"
      after:
        description: "Tylko Release'y utworzone po (ISO UTC)"
        default: "2026-10-08T16:00:00Z"
      dry:
        description: "Tylko pokaż plan"
        type: boolean
        default: false

concurrency:
  group: upload-backlog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TOK_PL: ${{ secrets.YT_REFRESH_TOKEN_PL }}
          TOK_DE: ${{ secrets.YT_REFRESH_TOKEN_DE }}
          TOK_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          TOK_HI: ${{ secrets.YT_REFRESH_TOKEN_HI }}
          TOK_UK: ${{ secrets.YT_REFRESH_TOKEN_UA }}
          TOK_RU: ${{ secrets.YT_REFRESH_TOKEN_RU }}
          TOK_TR: ${{ secrets.YT_REFRESH_TOKEN_TR }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANNELS: ${{ inputs.channels }}
          AFTER: ${{ inputs.after }}
          DRY: ${{ inputs.dry }}
          INTERVAL_DAYS: "1"
        run: |
          rc=0
          for ch in $CHANNELS; do
            case $ch in
              pl) TZ_=Europe/Warsaw; T=$TOK_PL ;;  de) TZ_=Europe/Berlin; T=$TOK_DE ;;
              en) TZ_=America/New_York; T=$TOK_EN ;;  hi) TZ_=Asia/Kolkata; T=$TOK_HI ;;
              uk) TZ_=Europe/Kyiv; T=$TOK_UK ;;  ru) TZ_=Europe/Moscow; T=$TOK_RU ;;  tr) TZ_=Europe/Istanbul; T=$TOK_TR ;;
            esac
            if [ -z "$T" ] && [ "$DRY" != "true" ]; then echo "::error::[$ch] brak tokenu YouTube"; rc=1; continue; fi
            echo "::group::Kanał $ch"
            CHANNEL=$ch PUBLISH_TZ=$TZ_ YT_REFRESH_TOKEN=$T python src/upload_backlog.py --after "$AFTER" $([ "$DRY" = "true" ] && echo --dry) || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - name: Commit state
        if: always()
        run: |
          git config user.name "episode-bot"
          git config user.email "episode-bot@users.noreply.github.com"
          git add state || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: upload backlog"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((2**i)); done
          exit 1
